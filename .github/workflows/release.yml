name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Portable CPU code (AVX2), never the runner's own instruction set.
      GGML_NATIVE: "OFF"
      # Signs the installer for the updater (section 17). The key is the one the Tauri build
      # used, so installed copies of either kind accept the update; `xtask dist` checks the
      # signature against the app's public key before anything is published.
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v7.0.1
      # whisper.cpp's Vulkan build nests MSBuild paths deep enough to pass MAX_PATH under the
      # default target dir. rust-cache below points at the same folder.
      - name: Short cargo target dir
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$([IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\..\t"))" >> $env:GITHUB_ENV'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.363.0
          cache: true
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: ". -> ../t"
      - run: cargo install cargo-packager --locked --version 0.11.8
      # The GPU build with the Khronos Vulkan loader beside the exe, the licence list, the NSIS
      # installer, its signature and latest.json for the updater.
      - run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            ${{ env.CARGO_TARGET_DIR }}/dist/*-setup.exe
            ${{ env.CARGO_TARGET_DIR }}/dist/*-setup.exe.sig
            ${{ env.CARGO_TARGET_DIR }}/dist/latest.json
          if-no-files-found: error
          retention-days: 1

  macos:
    # Apple Silicon; the .dmg is for M1 and later.
    runs-on: macos-latest
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo install cargo-packager --locked --version 0.11.8
      # The Metal build as Chidori.app, signed ad hoc, in a .dmg (section 17).
      - run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/dist/*.dmg
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            **Windows 10/11（64ビット）**: 下の `Chidori_…_x64-setup.exe` をダウンロードして開いてください。
            「Windows によって PC が保護されました」と表示されたら、**詳細情報** → **実行** を押します（インストーラーはまだコード署名されていません）。

            **Mac（Apple シリコン、macOS 14.6 以降、試験中）**: `Chidori_…_aarch64.dmg` を開いて Chidori をアプリケーションにドラッグします。初回は **システム設定 → プライバシーとセキュリティ → このまま開く** で開いてください（まだ公証を受けていません）。アプリ単位の録音はまだできません。

            使い方は [README](https://github.com/${{ github.repository }}#readme) をご覧ください。

            **Windows 10/11 (64-bit)**: download `Chidori_…_x64-setup.exe` below and open it.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway** (the installer isn't code-signed yet).

            **Mac (Apple Silicon, macOS 14.6+, early testing)**: open `Chidori_…_aarch64.dmg` and drag Chidori onto Applications. The first time, open it through **System Settings → Privacy & Security → Open Anyway** (it isn't notarized yet). Recording a single app isn't available on Mac yet.

            See the [English README](https://github.com/${{ github.repository }}/blob/main/README.en.md) for the full guide.
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "Chidori $GITHUB_REF_NAME" \
            --notes "$NOTES" dist/*-setup.exe dist/*-setup.exe.sig dist/latest.json dist/*.dmg
